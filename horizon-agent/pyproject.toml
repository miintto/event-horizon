[project]
name = "horizon-agent"
version = "0.1.0"
description = "Event Horizon - 인스턴스 지표 수집 에이전트"
requires-python = ">=3.14"
dependencies = [
    "psutil>=6.1.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
